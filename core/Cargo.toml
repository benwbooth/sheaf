[package]
name = "sheaf-core"
version = "0.1.0"
edition = "2021"
description = "sheaf's scanner, image and export code (no Qt)"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"
